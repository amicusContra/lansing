    "https://mibusinessregistry.lara.state.mi.us",
    "https://apps.michigan.gov/ichat",
    "https://cfrs.michigan.gov",
    "https://www.michbar.org",
    "https://eu.freep.com",
    "https://www.freep.com",
    "https://www.detroitnews.com",
]

