{% extends "base.html" %}
{% block title %}Connections — {{ config.title }}{% endblock %}
{% block content %}
<article class="page-content">
  <h1>Connection Types</h1>
  <div class="section-grid">
    {% for term in terms %}
    <a href="{{ term.permalink | safe }}" class="card">
      <h3>{{ term.name }}</h3>
      <p>{{ term.pages | length }} reference{{ term.pages | length | pluralize }}</p>
    </a>
    {% endfor %}
  </div>
</article>
{% endblock %}
